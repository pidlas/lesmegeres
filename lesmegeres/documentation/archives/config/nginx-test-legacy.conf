server {
    listen 80;
    # Local: "public" — En production remplacer par le vrai domaine
    server_name sante9naturel.fr/test www.sante9naturel.fr/test;

    root /var/www/my_webapp__2;
    index index.php;

    # Logs
    access_log /var/log/nginx/test.access.log;
    error_log  /var/log/nginx/test.error.log;

    # --- Sécurité ----------------------------------------------------------

    # Bloquer l'accès aux fichiers cachés (.htaccess, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # Défense en profondeur : si includes ou archive réapparaissent ici
    location ^~ /includes/ { deny all; }
    location ^~ /archive/  { deny all; }

    # --- Redirections legacy -----------------------------------------------

    # Anciennes URLs /pages/slug.php -> /slug
    location ~ ^/pages/([A-Za-z0-9-]+)\.php$ {
        return 301 /$1;
    }

    # --- Assets statiques --------------------------------------------------

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|otf|pdf|mp3|ogg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        log_not_found off;
        access_log off;
    }

    # --- Front controller --------------------------------------------------

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP-FPM -----------------------------------------------------------

    location ~ \.php$ {
        # Canonical home: redirect direct /index.php requests only (not internal rewrites)
        if ($request_uri ~ "^/index\.php") {
            return 301 /;
        }
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4cd my  -fpm.sock;
    }
}
