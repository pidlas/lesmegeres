# SOURCE OF TRUTH (local repository)
#
# Purpose:
# - Apache VirtualHost reference for the lesmegeres site.
# - Functional equivalent of nginx-lesmegeres.conf for a non-YunoHost Apache stack.
#
# Important:
# - Do not assume this file is auto-loaded by Apache.
# - To apply on a server, copy it to /etc/apache2/sites-available/<site>.conf,
#   enable the site, then reload Apache.
#
# Typical apply workflow:
# 1) sudo cp /var/www/lesmegeres/apache-lesmegeres.conf /etc/apache2/sites-available/megeres.conf
# 2) sudo a2enmod rewrite headers expires
# 3) sudo a2ensite megeres.conf
# 4) sudo apachectl configtest
# 5) sudo systemctl reload apache2
#
# Minimum post-apply checks:
# - curl -I http://lesmegeres/
# - curl -I http://lesmegeres/security.txt
# - curl -I http://lesmegeres/.well-known/security.txt
# - curl -I http://lesmegeres/.well-known/pgp-key.txt
#
# Notes:
# - This vhost assumes the project root is /var/www/lesmegeres.
# - If you use HTTPS, duplicate this vhost under a :443 block with SSL directives.

<VirtualHost *:80>
    ServerName lesmegeres
    ServerAlias lesmegeresdelhumus.fr www.lesmegeresdelhumus.fr

    DocumentRoot /var/www/lesmegeres
    DirectoryIndex index.php

    ErrorLog ${APACHE_LOG_DIR}/megeres.error.log
    CustomLog ${APACHE_LOG_DIR}/megeres.access.log combined

    <Directory /var/www/lesmegeres>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On

    # --- Mode maintenance -------------------------------------------------
    # Activer: touch /var/www/lesmegeres/.maintenance
    # Desactiver: rm /var/www/lesmegeres/.maintenance
    RewriteCond %{REQUEST_URI} !^/maintenance/ [NC]
    RewriteCond %{REQUEST_URI} !^/images/favicon/ [NC]
    RewriteCond %{REQUEST_URI} !^/images/logohumous [NC]
    RewriteCond %{DOCUMENT_ROOT}/.maintenance -f
    RewriteRule ^ /maintenance/index.html [R=302,L]

    # --- Canonical et legacy ---------------------------------------------

    # Canonical home URL
    RewriteCond %{THE_REQUEST} \s/+index\.php[\s?] [NC]
    RewriteRule ^index\.php$ / [R=301,L]

    # Redirect legacy page URLs to clean slugs
    RewriteCond %{THE_REQUEST} \s/+pages/([A-Za-z0-9-]+)\.php[\s?] [NC]
    RewriteRule ^pages/([A-Za-z0-9-]+)\.php$ /$1 [R=301,L]

    # --- Protection acces -------------------------------------------------

    # Bloquer les dotfiles, sauf .well-known
    RewriteRule (^|/)\.(?!well-known(?:/|$)) - [F,L,NC]

    # Defense en profondeur: bloquer includes/archive s'ils reapparaissent
    RewriteRule ^includes/ - [F,L,NC]
    RewriteRule ^archive/ - [F,L,NC]

    # --- Assets et fichiers speciaux -------------------------------------

    Alias /security.txt /var/www/lesmegeres/security.txt
    Alias /.well-known/security.txt /var/www/lesmegeres/.well-known/security.txt
    Alias /.well-known/pgp-key.txt /var/www/lesmegeres/.well-known/pgp-key.txt

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 30 days"
        ExpiresByType application/javascript "access plus 30 days"
        ExpiresByType image/jpeg "access plus 30 days"
        ExpiresByType image/png "access plus 30 days"
        ExpiresByType image/gif "access plus 30 days"
        ExpiresByType image/svg+xml "access plus 30 days"
        ExpiresByType image/webp "access plus 30 days"
        ExpiresByType image/x-icon "access plus 30 days"
        ExpiresByType font/woff2 "access plus 30 days"
        ExpiresByType font/woff "access plus 30 days"
        ExpiresByType application/pdf "access plus 30 days"
        ExpiresByType audio/mpeg "access plus 30 days"
        ExpiresByType audio/ogg "access plus 30 days"
    </IfModule>

    # --- Headers de securite ---------------------------------------------

    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; media-src 'self'; object-src 'none'"

        <FilesMatch "\.(css|js|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|otf|pdf|mp3|ogg|webp)$">
            Header set Cache-Control "public, immutable"
        </FilesMatch>
    </IfModule>

    # --- Front controller -------------------------------------------------

    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]

    RewriteRule ^ index.php [L,QSA]

    # --- PHP-FPM ----------------------------------------------------------

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
    </FilesMatch>
</VirtualHost>
