# SOURCE OF TRUTH (local repository)
#
# Purpose:
# - Reference Nginx vhost configuration for this project.
# - Used as the canonical template for local/server updates.
#
# Important:
# - Do not assume this file is auto-loaded by Nginx.
# - To apply on a server, copy it to an active vhost path (example below),
#   then validate and reload Nginx.
#
# Typical apply workflow:
# 1) sudo cp /var/www/lesmegeres/nginx-lesmegeres.conf /etc/nginx/conf.d/megeres.conf
# 2) sudo nginx -t
# 3) sudo systemctl reload nginx
#
# Minimum post-apply checks:
# - curl -I http://lesmegeres/
# - curl -I http://lesmegeres/security.txt
# - curl -I http://lesmegeres/.well-known/security.txt
# - curl -I http://lesmegeres/.well-known/pgp-key.txt
#
# Note YunoHost:
# - On YunoHost, app-generated nginx files can override custom edits.
# - Keep project changes documented in documentation/runbooks and re-apply after
#   app upgrades when required.

server {
    listen 80;
    # Local: "lesmegeres" — En production remplacer par le vrai domaine
    server_name lesmegeres lesmegeresdelhumus.fr www.lesmegeresdelhumus.fr;

    root /var/www/lesmegeres;
    index index.php;

    # Logs
    access_log /var/log/nginx/megeres.access.log;
    error_log  /var/log/nginx/megeres.error.log;

    # --- Sécurité ----------------------------------------------------------

    # Headers de sécurité HTTP (Phase 3)
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    # CSP progressive : bloque les plugins, empêche le clickjacking, autorise inline pour compatibilité
    add_header Content-Security-Policy  "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; media-src 'self'; object-src 'none'" always;

    # --- Mode maintenance --------------------------------------------------
    # Activer  : touch /var/www/lesmegeres/.maintenance
    # Désactiver: rm /var/www/lesmegeres/.maintenance

    set $maint 0;
    if (-f /var/www/lesmegeres/.maintenance) { set $maint 1; }
    # Laisser passer la page et ses assets (fonts, bg, logo, favicon)
    if ($uri ~* "^/(maintenance/|images/favicon/|images/logohumous)") { set $maint 0; }
    if ($maint = 1) {
        return 302 /maintenance/index.html;
    }

    # Bloquer l'accès aux fichiers cachés (.htaccess, .git, etc.)
    # sauf le dossier standard .well-known requis pour security.txt/PGP.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Défense en profondeur : si includes ou archive réapparaissent ici
    location ^~ /includes/ { deny all; }
    location ^~ /archive/  { deny all; }

    # --- Redirections legacy -----------------------------------------------

    # Anciennes URLs /pages/slug.php -> /slug
    location ~ ^/pages/([A-Za-z0-9-]+)\.php$ {
        return 301 /$1;
    }

    # --- Assets statiques --------------------------------------------------

    location = /security.txt {
        default_type text/plain;
        alias /var/www/lesmegeres/security.txt;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        alias /var/www/lesmegeres/.well-known/security.txt;
    }

    location = /.well-known/pgp-key.txt {
        default_type text/plain;
        alias /var/www/lesmegeres/.well-known/pgp-key.txt;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|otf|pdf|mp3|ogg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        log_not_found off;
        access_log off;
    }

    # --- Front controller --------------------------------------------------

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP-FPM -----------------------------------------------------------

    location ~ \.php$ {
        # Canonical home: redirect direct /index.php requests only (not internal rewrites)
        if ($request_uri ~ "^/index\.php") {
            return 301 /;
        }
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
}
